name: Streamlit Keep Alive

on:
  schedule:
    # Run every 30 minutes to ensure it never sleeps
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run wake-up script
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          python .github/scripts/wake_up.py

      - name: Upload screenshot artifact (Optional/Debug)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: streamlit-screenshot
          path: |
            screenshot.png
            error_screenshot.png
          if-no-files-found: ignore
